<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALHAR MOBILE SHOP AND ELECTRONIC</title>
    <!-- Google Fonts for Futuristic Look -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- STEP 1: 3D SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-content">
            <h1 class="logo-text">MALHAR<br><span class="sub-text">MOBILE & ELECTRONIC</span></h1>
            <div class="loader">
                <div class="load-bar"></div>
            </div>
        </div>
    </div>

    <!-- STEP 2: AUTHENTICATION PAGE -->
    <div id="auth-screen" class="hidden">
        <div class="auth-container">
            <div class="auth-header">
                <h2 id="auth-title">WELCOME BACK</h2>
                <div class="toggle-btns">
                    <button id="btn-login-active" class="toggle active" onclick="switchAuthMode('login')">Login</button>
                    <button id="btn-signup" class="toggle" onclick="switchAuthMode('signup')">Sign Up</button>
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="login-username" placeholder="Mobile Number / Username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-neon">LOGIN <i class="fas fa-arrow-right"></i></button>
                <p class="switch-text">New here? <a href="#" onclick="switchAuthMode('signup')">Create Account</a></p>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form" class="auth-form hidden">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="reg-name" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="text" id="reg-contact" placeholder="Mobile or Email" required>
                </div>
                
                <!-- OTP Section -->
                <div class="otp-section">
                    <button type="button" id="send-otp-btn" class="btn-outline" onclick="sendOTP()">SEND OTP</button>
                    <div id="otp-input-field" class="input-group hidden">
                        <i class="fas fa-key"></i>
                        <input type="text" id="reg-otp" placeholder="Enter OTP (Use '1234')" maxlength="4">
                    </div>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="reg-password" placeholder="Set Password" required>
                </div>
                <button type="submit" class="btn-neon">REGISTER <i class="fas fa-user-plus"></i></button>
                <p class="switch-text">Already have an account? <a href="#" onclick="switchAuthMode('login')">Login</a></p>
            </form>
        </div>
    </div>

    <!-- STEP 3: DASHBOARD -->
    <div id="dashboard-screen" class="hidden">
        <!-- Mobile Menu Toggle -->
        <div class="mobile-menu-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </div>

        <div class="dashboard-layout">
            <!-- Sidebar -->
            <nav id="sidebar">
                <div class="brand">
                    <h3>MALHAR<span class="gold">.MOB</span></h3>
                </div>
                <ul class="nav-links">
                    <li onclick="loadSection('home')" class="active-nav"><i class="fas fa-home"></i> Home</li>
                    <li onclick="loadSection('mobiles')"><i class="fas fa-mobile-alt"></i> Order Mobiles</li>
                    <li onclick="loadSection('profile')"><i class="fas fa-user"></i> My Details</li>
                    <li onclick="loadSection('about')"><i class="fas fa-info-circle"></i> About Shop</li>
                    <li onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Log Out</li>
                </ul>
            </nav>

            <!-- Main Content -->
            <main id="main-content">
                <!-- Dynamic Content Injected via JS -->
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
